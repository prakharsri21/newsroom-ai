[project]
name = "newsroom-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.142.2",
    "firecrawl-py>=4.46.2",
    "httpx>=0.28.1",
    "langchain-openai>=1.6.7",
    "langfuse>=4.16.0",
    "langgraph>=1.2.14",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.3",
    "tavily-python>=0.8.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
